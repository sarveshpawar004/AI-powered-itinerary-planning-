{% extends 'base.html' %}

{% block content %}
<section class="container" style="padding: 100px 20px;">
    <h1 class="section-title animate-up">Discover Your Next Adventure</h1>
    <p class="section-subtitle animate-up delay-1"
        style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">
        Explore these curated destinations for inspiration.
    </p>

    <div class="trip-list"
        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
        {% for dest in destinations %}
        <div class="trip-card animate-up delay-{{ loop.index0 % 5 }}"
            style="cursor: pointer; transition: transform 0.3s ease;">
            <div class="trip-img"
                style="background-image: url('{{ dest.image }}'); height: 200px; background-size: cover; background-position: center; border-radius: 12px 12px 0 0; position: relative;">
                <div class="overlay"
                    style="position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.6)); border-radius: 12px 12px 0 0;">
                </div>
            </div>
            <div class="trip-info" style="padding: 20px;">
                <h3 style="margin-top: 0; margin-bottom: 10px; color: var(--text-color);">{{ dest.name }}</h3>
                <p style="color: var(--text-muted); font-size: 0.9em; line-height: 1.5;">{{ dest.description }}</p>
                <button class="btn btn-secondary" style="margin-top: 15px; width: 100%;"
                    onclick="planTrip('{{ dest.name.split(',')[0] }}')">
                    Plan this Trip
                </button>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

<script>
    async function planTrip(destination) {
        const btn = event.target;
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "Planning...";

        // Default values for instant planning
        const data = {
            destination: destination,
            start_date: new Date().toISOString().split('T')[0], // Today
            duration: 5,
            budget: "$2000",
            style: "Leisure",
            transport: "Flight"
        };

        try {
            const response = await fetch('/generate_trip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'API Error');
            }

            const result = await response.json();

            if (result.success) {
                window.location.href = `/result`;
            }
        } catch (error) {
            console.error('Error:', error);
            alert(`Something went wrong: ${error.message}`);
            btn.disabled = false;
            btn.innerText = originalText;
        }
    }
</script>
{% endblock %}
